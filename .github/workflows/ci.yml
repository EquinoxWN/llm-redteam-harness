name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every action is pinned to a full commit SHA; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (exact versions from constraints.txt)
        run: make setup
      - name: Lint (ruff, ruff format, mypy --strict)
        run: make lint
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log
          echo "::notice title=pytest::$(tail -n 1 pytest.log)"
      - name: Red-team run and regression gate (hardened agent vs baselines/hardened.json)
        shell: bash
        run: |
          set -o pipefail
          lrh run --gate baselines/hardened.json --json report.json --markdown report.md | tee redteam.log
          echo "::notice title=red-team gate::$(grep '^RESULT' redteam.log)"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Failing output as an annotation (logs need signing in)
        if: failure()
        shell: bash
        run: |
          for f in pytest.log redteam.log; do
            [ -f "$f" ] && tail -n 30 "$f" | python3 -c "import sys; print('::error title=$f (last lines)::' + sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
          done
          exit 0
      - name: Known-vulnerability audit
        run: make audit
