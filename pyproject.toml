[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam-harness"
version = "0.1.0"
description = "Before you ship an AI feature, find how it gets jailbroken or leaks data, automatically, with a score you can track."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[project.scripts]
lrh = "llm_redteam_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_redteam_harness = ["data/*.json", "data/attacks/*.json", "data/corpus/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.tmp/pytest -p no:cacheprovider"
timeout = 300

[tool.ruff]
line-length = 110
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
